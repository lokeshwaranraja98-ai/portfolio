<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physiotherapy Services</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <header>
        <nav>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Personalised Physiotherapy for a Stronger, Independent You</h1>
        <img src="hero-image.jpg" alt="Physiotherapy">
    </section>

    <!-- Feature Icons -->
    <section class="features">
        <div class="feature">37,000+ Seniors Served</div>
        <div class="feature">Clinical Protocols</div>
        <div class="feature">Ease of Coordination</div>
    </section>

    <!-- Inquiry Form -->
    <section class="form-section">
        <form>
            <input type="text" placeholder="Name" required>
            <input type="email" placeholder="Email" required>
            <input type="tel" placeholder="Phone no.">
            <select>
                <option>Select your city</option>
                <option>Delhi NCR</option>
                <option>Bangalore</option>
                <option>Chennai</option>
            </select>
            <button type="submit">Submit</button>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>© Physiotherapy Services 2026</p>
    </footer>

</body>
</html>
