<!DOCTYPE html>
<html>
<head>
  <title>AI Light Strings</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #050301; }
    video { display: none; }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
  </style>
</head>

<body>
<video id="video"></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Smooth points
let p1 = null;
let p2 = null;

// ✨ Draw glowing string
function drawLight(x1, y1, x2, y2) {
  const segments = 30;

  ctx.shadowColor = "#00FFAA";
  ctx.shadowBlur = 20;

  for (let i = 0; i <= segments; i++) {
    let t = i / segments;

    // wave effect
    let wave = Math.sin(t * Math.PI * 4) * 20;

    let x = x1 + (x2 - x1) * t + wave;
    let y = y1 + (y2 - y1) * t;

    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${t * 120}, 100%, 60%)`;
    ctx.fill();
  }
}

// ✋ Main function
function onResults(results) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // dark overlay
  ctx.fillStyle = "rgba(5,3,1,0.8)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (results.multiHandLandmarks.length >= 2) {

    let hand1 = results.multiHandLandmarks[0];
    let hand2 = results.multiHandLandmarks[1];

    let x1 = hand1[8].x * canvas.width;
    let y1 = hand1[8].y * canvas.height;

    let x2 = hand2[8].x * canvas.width;
    let y2 = hand2[8].y * canvas.height;

    // smoothing
    if (!p1) {
      p1 = {x: x1, y: y1};
      p2 = {x: x2, y: y2};
    } else {
      p1.x += (x1 - p1.x) * 0.3;
      p1.y += (y1 - p1.y) * 0.3;
      p2.x += (x2 - p2.x) * 0.3;
      p2.y += (y2 - p2.y) * 0.3;
    }

    // distance check (gesture)
    let dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);

    if (dist > 80) {
      drawLight(p1.x, p1.y, p2.x, p2.y);
    }
  }
}

// MediaPipe Setup
const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults(onResults);

const camera = new Camera(video, {
  onFrame: async () => {
    await hands.send({image: video});
  },
  width: 1280,
  height: 720
});

camera.start();
</script>

</body>
</html>
